[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sra-search"
version = "0.1.0"
description = "多组学数据集智能检索与管理工具"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SRA_search contributors"},
]

dependencies = [
    "biopython>=1.83",
    "pandas>=2.0",
    "click>=8.0",
    "aiohttp>=3.9",
    "loguru>=0.7",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]
geo = [
    "GEOparse>=2.0",
]
sra = [
    "pysradb>=2.0",
]
all = [
    "sra-search[dev,geo,sra]",
]

[project.scripts]
sra-search = "sra_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
